services:
  mysql:
    image: mysql:8.0
    container_name: datatools-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - datatools-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    image: ghcr.io/dugongzi/datatools:latest
    container_name: datatools-app
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_MAX_AGE: ${ACCESS_TOKEN_MAX_AGE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_ROLE: ${ADMIN_ROLE}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3000:80"
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datatools-network

  scheduler:
    image: ghcr.io/dugongzi/datatools:latest
    container_name: datatools-scheduler
    command: ["python", "-m", "backend.scheduler"]
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_MAX_AGE: ${ACCESS_TOKEN_MAX_AGE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_ROLE: ${ADMIN_ROLE}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datatools-network

volumes:
  mysql-data:
    driver: local

networks:
  datatools-network:
    driver: bridge
