services:
  mysql:
    image: mysql:8.0
    container_name: datatools-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - datatools-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: datatools
    container_name: datatools-app
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    ports:
      - "3000:80"
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datatools-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: datatools
    container_name: datatools-scheduler
    command: ["python", "-m", "backend.scheduler"]
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datatools-network

volumes:
  mysql-data:
    driver: local

networks:
  datatools-network:
    driver: bridge
