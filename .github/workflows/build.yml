name: Docker Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: datatools

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Build all images
        run: docker compose build

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME}"
          for name in frontend backend; do
            docker tag "datatools-$name" "$IMAGE_PREFIX/$name:$VERSION"
            docker tag "datatools-$name" "$IMAGE_PREFIX/$name:latest"
            docker push "$IMAGE_PREFIX/$name:$VERSION"
            docker push "$IMAGE_PREFIX/$name:latest"
          done

      - name: Package images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker save datatools-frontend | gzip -1 > "datatools-frontend-${GITHUB_REF_NAME}.tar.gz"
          docker save datatools-backend | gzip -1 > "datatools-backend-${GITHUB_REF_NAME}.tar.gz"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              ./*.tar.gz
          fi
